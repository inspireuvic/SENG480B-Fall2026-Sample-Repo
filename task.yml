name: Task
description: Record a specific development, design, testing, or other project task
title: "[Task] "
type: "Task"

body:
  - type: markdown
    attributes:
      value: |
        Use this form to record a specific piece of project work.

        This template can be used for development, design, architecture, testing, research, documentation, deployment, stakeholder engagement, project management, or other tasks.

  - type: dropdown
    id: task-type
    attributes:
      label: Task Type
      description: Select the category that best describes this Task.
      options:
        - Development
        - User interface or experience design
        - Architecture
        - Testing or quality assurance
        - Research or investigation
        - Documentation
        - Deployment or infrastructure
        - Stakeholder engagement
        - Project management
        - Other
    validations:
      required: true

  - type: textarea
    id: task-outcome
    attributes:
      label: Task and Expected Outcome
      description: Describe the specific work, why it is needed, and the expected result or deliverable.
      value: |
        Complete [specific work] to support [related requirement or project need].

        Expected outcome or deliverable:
    validations:
      required: true

  - type: textarea
    id: contributions
    attributes:
      label: Contributions
      description: Briefly record any stakeholder, development-team, other human, and AI contributions to defining or completing this Task. Enter None where applicable.
      value: |
        Stakeholder contribution, if any:

        Development team or other human contribution:

        AI contribution, if any:
    validations:
      required: true

  # - type: textarea
  #   id: completion-evidence
  #   attributes:
  #     label: Completion Criteria and Evidence
  #     description: Define how completion will be verified. Update the results and evidence as the Task progresses.
  #     value: |
  #       Completion criteria:
  #       - [ ] The required work has been completed.
  #       - [ ] The result has been reviewed or tested.
  #       - [ ] Relevant evidence has been linked.

    #     Review or test result:

    #     Evidence link:
    # validations:
    #   required: true

  # - type: textarea
  #   id: dependencies-constraints
  #   attributes:
  #     label: Dependencies and Constraints
  #     description: Record anything that may affect or block this Task, including dependencies, technical constraints, risks, or required decisions. Enter None if none are currently known.
  #     value: |
  #       Dependencies:

  #       Constraints or risks:

  #       Required decisions:
  #    validations:
  #     required: false

  - type: textarea
    id: additional-value-considerations
    attributes:
      label: Additional Value Considerations
      description: Record only value impacts, tensions, or decisions specific to this Task that are not already documented in the parent Epic, Feature, or User Story. Enter None if there are no additional considerations.
      value: |
        Additional value consideration:

        Related decision or trade-off:
    validations:
      required: false

  - type: textarea
    id: review-verification
    attributes:
      label: Review and Verification
      description: Explain how the completed work and any AI contribution were reviewed. Enter Not yet reviewed or Not applicable where appropriate.
      value: |
        Work reviewed or tested by:

        How the AI contribution was verified:

        Outcome: [Accepted, Revised, Rejected, Not yet reviewed, or Not applicable]

        Changes made:
    validations:
      required: true

  # - type: checkboxes
