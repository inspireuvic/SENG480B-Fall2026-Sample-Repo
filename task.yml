  #   attributes:
  # #     label: Submission Confirmation
  # #     options:
  # #       - label: This Task is specific, actionable, and connected to a parent requirement.
  #         required: true
  #       - label: I will update the completion evidence and verification information as the work progresses.
  #         required: true

  - type: markdown
    attributes:
      value: |
        After creating this Task:

        1. Open the relevant parent issue and to sub-issues.
        2. Under **Sub-issues**, select **Add existing issue** and add this Task.
