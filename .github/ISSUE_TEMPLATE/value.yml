name: Value
description: Record a value identified through stakeholder elicitation
title: "[Value] "
type: "Value"

body:
  - type: markdown
    attributes:
      value: |
        Record value identified through stakeholder engagement.

        Use a short, context-specific title, for example:
        `[Value] Cultural connection: connecting language learning to W̱SÁNEĆ culture`

        GitHub will automatically assign an issue number. Use that number when referring to this Value, for example, `Value #12`.

  - type: textarea
    id: value-meaning
    attributes:
      label: Value and Context-Specific Meaning
      description: Name the value and briefly explain what it means in the context of this project.
      value: |
        Value:

        Context-specific meaning:
    validations:
      required: true

  - type: textarea
    id: derivation-evidence
    attributes:
      label: Value Derivation and Evidence
      description: Briefly record how stakeholders, the development team, and AI contributed to identifying or interpreting this value. Enter None if AI was not used.
      value: |
        Stakeholder or group:

        What the stakeholder provided:

        Development team contribution:

        AI contribution, if any:

        Evidence link:
    validations:
      required: true

  - type: textarea
    id: product-implications
    attributes:
      label: What This Value Means for the Product
      description: Explain what the product should support, protect, enable, or avoid because of this value. Include any known tension or trade-off.
      value: |
        The product should:

        The product should avoid:

        Known tension or trade-off:
    validations:
      required: true

  - type: textarea
    id: review-validation
    attributes:
      label: Review and Validation
      description: Explain whether the finalized value was verified with stakeholders and how any AI contribution was checked. Enter Not yet validated or Not applicable where appropriate.
      value: |
        Stakeholder validation:

        How the AI contribution (if any) was verified:

        Final outcome or changes made:
    validations:
      required: true

  - type: textarea
    id: related-epics
    attributes:
      label: Related Epics
      description: "Link all Epics that address or are affected by this Value. Type # to view and select existing issues. After selecting an issue, add its title, for example: #12 — Cultural Learning Activities. If no relevant Epic exists, create one and link it afterward."
      placeholder: "Type # to view and select existing Epic issues."
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        Important:

        - Link the Value to relevant Epics using the **Related Epics** field.
        - Open each related Epic and link this Value in its **Related Values** section.
        - Use the native sub-issue relationship only for the following work hierarchy:

          `Value<->Epic → Feature → User Story → Task`

        - Update the Review and Validation section when stakeholder feedback is received.
