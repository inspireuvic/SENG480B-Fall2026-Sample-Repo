name: User Story
description: Record a small, testable, stakeholder-focused product need
title: "[User Story] "
type: "User Story"

body:
  - type: markdown
    attributes:
      value: |
        Use this form to record a small, stakeholder-focused need that can be implemented and tested independently.

        Example:
        `As a student, I want to preview my uploaded assignment so that I can confirm I submitted the correct file.`

  - type: textarea
    id: user-story-context
    attributes:
      label: User Story and Context
      description: Describe who needs something, what they need, why they need it, and any necessary context.
      value: |
        As a [stakeholder role], I want [need or capability] so that [reason or benefit].

        Relevant context:
    validations:
      required: true

  - type: textarea
    id: derivation-evidence
    attributes:
      label: User Story Derivation and Evidence
      description: Briefly explain how stakeholders, the development team, and AI contributed to defining this User Story. Enter None if AI was not used.
      value: |
        Stakeholder or group:

        What the stakeholder provided:

        Development team contribution:

        AI contribution, if any:

        Evidence link:
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: List observable and testable conditions that must be satisfied for this User Story to be considered complete. Replace the bracketed text and add or remove criteria as needed.
      value: |
        - [ ] Given [starting condition], when [action occurs], then [expected result].
        - [ ] Given [starting condition], when [action occurs], then [expected result].
        - [ ] The completed User Story can be demonstrated and tested.
    validations:
      required: true

  # - type: textarea
  #   id: constraints
  #   attributes:
  #     label: Constraints and Special Considerations
  #     description: Any known constraints or considerations.
  #     value: |
  #       Constraints:

  #       Special considerations:
  #    validations:
  #     required: false

  # - type: textarea
  #   id: additional-value-considerations
  #   attributes:
  #     label: Additional Value Considerations
  #     description: Record only value impacts, tensions, or decisions specific to this User Story that are not already documented in the parent Epic or Feature. Enter None if there are no additional considerations.
  #     value: |
  #       Additional value consideration:

  #       Related decision or trade-off:
  #   validations:
  #     required: false

  - type: textarea
    id: review-validation
    attributes:
      label: Review and Validation
      description: Explain whether the User Story was reviewed with stakeholders and how any AI contribution was verified. Enter Not yet validated or Not applicable where appropriate.
      value: |
        Stakeholder validation:

        How the AI contribution was verified:

        Final outcome or changes made:
    validations:
      required: true

  # - type: checkboxes
  #   id: confirmation
  #   attributes:
  #     label: Submission Confirmation
  #     options:
  #        - label: I reviewed this User Story to confirm that it is clear, stakeholder-focused, and small enough to implement and test independently.
  #          required: true
  #       - label: The acceptance criteria describe observable and testable outcomes.
  #         required: true

  - type: markdown
    attributes:
      value: |
        After creating this User Story:

        1. Open its parent Feature.
        2. Under **Sub-issues**, select **Add existing issue** and add this User Story.
        3. Under this User Story's **Sub-issues**, select **Create sub-issue** to create a new Task or **Add existing issue** to connect an existing Task.
        5. Update this User Story when its acceptance criteria, stakeholder feedback, AI verification, or value considerations change.
